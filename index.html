<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Évaluation – Défi 12H – Robot Serveur</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --e1: #5b21b6; --e1-light: #ede9fe; --e1-mid: #c4b5fd;
  --e2: #0e7490; --e2-light: #e0f2fe; --e2-mid: #7dd3fc;
  --e3: #065f46; --e3-light: #d1fae5; --e3-mid: #6ee7b7;
  --n0: #dc2626; --n1: #d97706; --n2: #16a34a;
  --gray1:#f8f8f8; --gray2:#f0f0f0; --gray3:#d4d4d4;
  --gray4:#a3a3a3; --gray5:#525252; --gray6:#1a1a1a;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#e5e5e5; font-family:'DM Sans',sans-serif; font-size:13px; color:var(--gray6); }

/* ── TOOLBAR ── */
.toolbar {
  background:#1e1e2e; color:#cdd6f4;
  padding:12px 32px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}
.toolbar-title { font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.06em; color:#89b4fa; }
.toolbar-legend { display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
.leg { display:flex; align-items:center; gap:5px; font-size:11px; color:#a6adc8; }
.leg-dot { width:18px; height:18px; border-radius:50%; border:1.5px solid; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; }
.btn-pdf {
  background:#89b4fa; color:#1e1e2e; border:none;
  padding:8px 20px; font-family:'DM Mono',monospace; font-size:12px; font-weight:600;
  border-radius:6px; cursor:pointer; letter-spacing:.05em;
  display:flex; align-items:center; gap:7px; transition:background .2s;
}
.btn-pdf:hover { background:#b4d0ff; }

/* ── PAGES WRAPPER ── */
.pages { display:flex; flex-direction:column; align-items:center; gap:24px; padding:28px 16px 48px; }

/* ── A4 SHEET ── */
.sheet {
  background:#fff;
  width:210mm; min-height:297mm;
  box-shadow:0 4px 24px rgba(0,0,0,.18);
  padding:13mm 14mm 11mm;
  display:flex; flex-direction:column; gap:0;
}
.e1 { --acc:var(--e1); --acc-l:var(--e1-light); --acc-m:var(--e1-mid); }
.e2 { --acc:var(--e2); --acc-l:var(--e2-light); --acc-m:var(--e2-mid); }
.e3 { --acc:var(--e3); --acc-l:var(--e3-light); --acc-m:var(--e3-mid); }

/* ── Sheet header ── */
.sh-head {
  border-bottom:2.5px solid var(--acc);
  padding-bottom:8px; margin-bottom:9px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.sh-meta { flex:1; }
.sh-defi {
  font-family:'DM Mono',monospace; font-size:8px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--acc); margin-bottom:3px;
}
.sh-title {
  font-family:'Source Serif 4',serif; font-size:16px; font-weight:700; line-height:1.15;
}
.sh-mission { font-size:10.5px; color:var(--gray5); margin-top:3px; font-style:italic; }

/* ── Score box ── */
.score-box {
  background:var(--acc-l); border:1.5px solid var(--acc-m); border-radius:8px;
  padding:7px 16px; text-align:center; min-width:105px;
}
.score-lbl { font-family:'DM Mono',monospace; font-size:8px; text-transform:uppercase; letter-spacing:.1em; color:var(--acc); margin-bottom:2px; }
.score-val { font-family:'Source Serif 4',serif; font-size:26px; font-weight:700; color:var(--acc); line-height:1; transition:color .3s; }
.score-den { font-size:10px; color:var(--acc); font-family:'DM Mono',monospace; }
.score-bar { width:75px; height:3px; background:var(--acc-m); border-radius:2px; margin:4px auto 0; overflow:hidden; }
.score-fill { height:100%; border-radius:2px; background:var(--acc); width:0%; transition:width .4s; }

/* ── Identity ── */
.id-row { display:flex; gap:20px; margin-bottom:9px; align-items:flex-end; flex-wrap:wrap; }
.id-f { display:flex; flex-direction:column; gap:2px; }
.id-lbl { font-family:'DM Mono',monospace; font-size:8px; text-transform:uppercase; letter-spacing:.1em; color:var(--gray4); }
.id-in {
  border:none; border-bottom:1.5px solid var(--gray3);
  padding:2px 0; font-family:'DM Sans',sans-serif; font-size:13.5px; font-weight:600;
  color:var(--gray6); width:130px; outline:none; background:transparent;
  transition:border-color .2s;
}
.id-in:focus { border-bottom-color:var(--acc); }

/* ── Hour group ── */
.hg { margin-bottom:5px; }
.hg-hdr {
  display:flex; align-items:center; gap:7px;
  padding:3px 7px; border-radius:4px; background:var(--gray1);
  margin-bottom:3px;
}
.hg-tag {
  font-family:'DM Mono',monospace; font-size:8px; font-weight:500;
  padding:2px 8px; border-radius:10px; white-space:nowrap;
}
.hg-tag.sp { background:var(--acc-l); color:var(--acc); border:1px solid var(--acc-m); }
.hg-tag.cm { background:#f5f5f5; color:var(--gray5); border:1px solid var(--gray3); }
.hg-ttl { font-size:9.5px; color:var(--gray5); font-style:italic; }

/* ── Mission row ── */
.mrow {
  display:flex; align-items:center; gap:8px;
  padding:4px 6px 4px 9px; margin-bottom:2px;
  border-radius:4px; border-left:2.5px solid var(--gray3);
  background:#fdfdfd; transition:background .12s;
}
.mrow:hover { background:var(--acc-l); }
.mrow.lv0 { border-left-color:var(--n0); }
.mrow.lv1 { border-left-color:var(--n1); }
.mrow.lv2 { border-left-color:var(--n2); }
.mtxt { flex:1; min-width:0; }
.mtit { font-size:11px; font-weight:500; color:var(--gray6); line-height:1.35; }
.mres { font-size:9px; color:var(--gray4); margin-top:1px; }
.mres b { color:var(--gray5); }

/* ── Level buttons ── */
.lvls { display:flex; gap:3px; flex-shrink:0; align-items:center; }
.lb {
  width:24px; height:24px; border-radius:50%; border:1.5px solid transparent;
  background:transparent; cursor:pointer;
  font-size:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  transition:all .12s; position:relative;
}
.lb[data-v="0"] { border-color:#fca5a5; color:#fca5a5; }
.lb[data-v="1"] { border-color:#fcd34d; color:#fcd34d; }
.lb[data-v="2"] { border-color:#86efac; color:#86efac; }
.lb[data-v="0"].on { background:#fef2f2; border-color:var(--n0); color:var(--n0); box-shadow:0 0 0 2px rgba(220,38,38,.15); }
.lb[data-v="1"].on { background:#fffbeb; border-color:var(--n1); color:var(--n1); box-shadow:0 0 0 2px rgba(217,119,6,.15); }
.lb[data-v="2"].on { background:#f0fdf4; border-color:var(--n2); color:var(--n2); box-shadow:0 0 0 2px rgba(22,163,74,.15); }
.lb:hover:not(.on) { transform:scale(1.15); background:var(--gray2); }
.tip {
  position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%);
  background:#1e1e2e; color:#cdd6f4; font-size:8.5px; font-family:'DM Mono',monospace;
  white-space:nowrap; padding:2px 6px; border-radius:3px;
  pointer-events:none; opacity:0; transition:opacity .12s; z-index:20;
}
.lb:hover .tip { opacity:1; }

/* ── Points ── */
.pts { font-family:'DM Mono',monospace; font-size:10px; color:var(--gray4); width:22px; text-align:right; flex-shrink:0; }
.pts.on { color:var(--acc); font-weight:600; }

/* ── Footer ── */
.sh-foot {
  margin-top:auto; padding-top:8px;
  border-top:1px solid var(--gray3);
  display:flex; justify-content:space-between; align-items:flex-end;
}
.obs { flex:1; }
.obs-lbl { font-family:'DM Mono',monospace; font-size:8px; text-transform:uppercase; letter-spacing:.1em; color:var(--gray4); margin-bottom:3px; }
.obs-line { border-bottom:1px solid var(--gray3); height:16px; width:88%; margin-bottom:4px; }
.sig { display:flex; flex-direction:column; align-items:center; gap:3px; }
.sig-lbl { font-family:'DM Mono',monospace; font-size:8px; text-transform:uppercase; letter-spacing:.1em; color:var(--gray4); }
.sig-box { width:65px; height:30px; border:1px solid var(--gray3); border-radius:4px; }

/* ═══ PRINT ═══ */
@media print {
  @page { size:A4; margin:0; }
  body { background:white; }
  .toolbar { display:none !important; }
  .pages { padding:0; gap:0; }
  .sheet {
    width:100%; min-height:0; height:297mm;
    box-shadow:none;
    page-break-after:always; break-after:page;
  }
  .sheet:last-child { page-break-after:avoid; break-after:avoid; }
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  .tip { display:none !important; }
  .lb.on { border-width:2px !important; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">STI2D — Évaluation Défi 12H · Robot Serveur</div>

        { t:'Réflexion collective sur les exigences à atteindre durant le défi', r:'Appropriation collective et individuelle du défi' },

      ]},
      { h:'H 2 – H 3', cm:true, ttl:'Appropriation du robot + mesures de performances', ms:[

      ]},

];

/* ── State: stored values are 0, 1 or 2 (= 0pt, 1pt, 2pts)
   Note = sum(values) / (nbMissions × 2) × 20              ── */
const STATE = {};

function calcNote(sid) {
  const s = DATA.find(x => x.id === sid);
  const nbMs = s.groups.reduce((a,g) => a + g.ms.length, 0);
  const maxPts = nbMs * 2;
  const total  = Object.entries(STATE)
    .filter(([k]) => k.startsWith(sid + '-'))
    .reduce((a,[,v]) => a + v, 0);
  const pct  = maxPts > 0 ? total / maxPts * 100 : 0;
  const note = (total / maxPts * 20).toFixed(1);
  return { note, pct };
}

function refreshNote(sid) {
  const { note, pct } = calcNote(sid);
  const el = document.getElementById('sv-' + sid);
  const fl = document.getElementById('sf-' + sid);
  if (!el) return;
  el.textContent = note;
  const n = parseFloat(note);
  el.style.color = n >= 14 ? '#16a34a' : n >= 10 ? '#d97706' : '#dc2626';
  fl.style.width = pct + '%';
  fl.style.background = pct >= 70 ? '#16a34a' : pct >= 50 ? '#d97706' : '#dc2626';
}

function clickLvl(btn, sid, gi, mi, val) {
  const key  = sid + '-' + gi + '-' + mi;
  const row  = btn.closest('.mrow');
  const btns = btn.closest('.lvls').querySelectorAll('.lb');
  const pts  = document.getElementById('pt-' + key);

  if (STATE[key] === val) {
    // deselect
    delete STATE[key];
    btns.forEach(b => b.classList.remove('on'));
    row.className = row.className.replace(/\blv\d\b/g,'').trim();
    if (pts) { pts.textContent = ''; pts.classList.remove('on'); }
  } else {
    STATE[key] = val;
    btns.forEach(b => b.classList.toggle('on', +b.dataset.v === val));
    row.className = row.className.replace(/\blv\d\b/g,'').trim() + ' lv' + val;
    if (pts) { pts.textContent = val; pts.classList.add('on'); }
  }
  refreshNote(sid);
}

function build(s) {
  const sheet = document.createElement('div');
  sheet.className = 'sheet ' + s.cls;

  // header
  const head = document.createElement('div');
  head.className = 'sh-head';
  head.innerHTML = `
    <div class="sh-meta">
      <div class="sh-defi">STI2D — Défi 12H · Robot Serveur · Thématique : L'homme assisté-augmenté</div>
      <div class="sh-title">${s.lbl} — Fiche d'évaluation individuelle</div>
      <div class="sh-mission">${s.mission}</div>
    </div>
    <div class="score-box">
      <div class="score-lbl">Note globale</div>
      <div class="score-val" id="sv-${s.id}">0.0</div>
      <div class="score-den">/ 20</div>
      <div class="score-bar"><div class="score-fill" id="sf-${s.id}"></div></div>
    </div>
  `;
  sheet.appendChild(head);

  // identity
  const idr = document.createElement('div');
  idr.className = 'id-row';
  idr.innerHTML = `
    <div class="id-f"><div class="id-lbl">Nom</div><input class="id-in" type="text" placeholder="Nom de famille" /></div>
    <div class="id-f"><div class="id-lbl">Prénom</div><input class="id-in" type="text" placeholder="Prénom" /></div>
    <div class="id-f"><div class="id-lbl">Groupe</div><input class="id-in" type="text" placeholder="N° groupe" style="width:75px"/></div>
    <div class="id-f" style="margin-left:auto"><div class="id-lbl">Date</div><input class="id-in" type="text" placeholder="jj/mm/aaaa" style="width:105px"/></div>
  `;
  sheet.appendChild(idr);

  // missions
  s.groups.forEach((grp, gi) => {
    const hg = document.createElement('div');
    hg.className = 'hg';
    const hdr = document.createElement('div');
    hdr.className = 'hg-hdr';
    hdr.innerHTML = `<span class="hg-tag ${grp.cm?'cm':'sp'}">${grp.h}</span><span class="hg-ttl">${grp.ttl}</span>`;
    hg.appendChild(hdr);

    grp.ms.forEach((m, mi) => {
      const row = document.createElement('div');
      row.className = 'mrow';
      row.innerHTML = `
        <div class="mtxt">
          <div class="mtit">${m.t}</div>
          <div class="mres"><b>Résultat attendu :</b> ${m.r}</div>
        </div>
        <div class="lvls">
          <button class="lb" data-v="0" onclick="clickLvl(this,'${s.id}',${gi},${mi},0)">✗<div class="tip">Non atteint — 0 pt</div></button>
          <button class="lb" data-v="1" onclick="clickLvl(this,'${s.id}',${gi},${mi},1)">~<div class="tip">Partiellement atteint — 1 pt</div></button>
          <button class="lb" data-v="2" onclick="clickLvl(this,'${s.id}',${gi},${mi},2)">✓<div class="tip">Atteint — 2 pts</div></button>
        </div>
        <div class="pts" id="pt-${s.id}-${gi}-${mi}"></div>
      `;
      hg.appendChild(row);
    });
    sheet.appendChild(hg);
  });

  // footer
  const foot = document.createElement('div');
  foot.className = 'sh-foot';
  foot.innerHTML = `
    <div class="obs">
      <div class="obs-lbl">Observations</div>
      <div class="obs-line"></div><div class="obs-line"></div>
    </div>
    <div class="sig">
      <div class="sig-lbl">Signature enseignant</div>
      <div class="sig-box"></div>
    </div>
  `;
  sheet.appendChild(foot);
  return sheet;
}

const container = document.getElementById('pages');
DATA.forEach(s => container.appendChild(build(s)));
</script>
</body>
</html>
